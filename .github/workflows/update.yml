name: update-data
on:
  schedule:
    # Every 30 min, 12:00–22:30 UTC, weekdays (≈ 8:00–18:30 ET during EDT).
    # Catches 8:30 ET releases within ~30–60 min of FRED ingestion.
    - cron: "0,30 12-22 * * 1-5"
    # One overnight run for late updates + non-US data
    - cron: "15 3 * * 2-6"
  workflow_dispatch:
    inputs:
      force_snapshot:
        description: "Write a ledger snapshot regardless of the time slot (QA)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build data (COT skipped on weekdays intraday)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # normally unset: the ledger writes only in the final weekday slot
          LEDGER_FORCE_SNAPSHOT: ${{ inputs.force_snapshot && '1' || '' }}
        run: python -m pipeline.build --no-cot
      - name: Validate contract + voice + consistency
        run: python -m pytest tests/ -q
      - name: Commit if changed
        run: |
          git config user.name "money-flow-bot"
          git config user.email "actions@github.com"
          git add data/ ledger/
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
