document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lign-items:center;gap:9px;margin-bottom:12px\">\n              <span style=\"width:5px;height:5px;border-radius:50%;background:#00E5FF;box-shadow:0 0 8px #00E5FF;animation:mf-pulse 2s ease-in-out infinite\"><\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.22em;color:#00E5FF\">HAPPENING RIGHT NOW<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:0.14em;color:#5A6B85\">{{ sys.stamp }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:clamp(14px,1.6vw,16px);line-height:1.6;color:#C9F4FF;text-wrap:pretty\">{{ lesson.live }}<\u002Fp>\n          <\u002Fdiv>\n\n          <p style=\"margin:0 0 clamp(22px,3vw,28px);font-size:13px;line-height:1.65;color:#8B9AAF;text-wrap:pretty;padding-left:14px;border-left:1px solid rgba(230,241,255,0.14)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.18em;color:#5A6B85;display:block;margin-bottom:7px\">CAVEAT<\u002Fspan>{{ lesson.caveat }}<\u002Fp>\n\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center\">\n            <span sc-camel-on-click=\"{{ lesson.onSeeIt }}\" style=\"display:inline-flex;align-items:center;gap:9px;padding:11px 17px;border:1px solid rgba(0,229,255,0.3);border-radius:999px;background:rgba(0,229,255,0.06);cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;color:#00E5FF;transition:border-color .15s\" style-hover=\"border-color:rgba(0,229,255,0.6)\">SEE IT ON THE PAGE \u2192<\u002Fspan>\n            <sc-if value=\"{{ lesson.hasNext }}\" hint-placeholder-val=\"{{ true }}\">\n              <span sc-camel-on-click=\"{{ lesson.onNext }}\" style=\"display:inline-flex;align-items:center;gap:9px;padding:11px 17px;border:1px solid rgba(230,241,255,0.12);border-radius:999px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;color:#9FB0C6;transition:border-color .15s,color .15s\" style-hover=\"border-color:rgba(0,229,255,0.4);color:#E6F1FF\">NEXT LESSON<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ indexOpen }}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"mf-sc\" style=\"{{ drawerStyle }}\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:clamp(18px,2.4vw,26px) clamp(18px,2.6vw,32px);border-bottom:1px solid rgba(0,229,255,0.14);position:sticky;top:0;background:rgba(8,12,22,0.96);backdrop-filter:blur(18px);z-index:2\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.22em;color:#00E5FF\">LEARN THE MACHINE<\u002Fspan>\n        <span sc-camel-on-click=\"{{ closeOverlay }}\" style=\"font-family:'JetBrains Mono',monospace;font-size:16px;line-height:1;color:#7A8BA3;cursor:pointer;padding:4px 6px;transition:color .15s\" style-hover=\"color:#E6F1FF\">\u2715<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:clamp(20px,2.6vw,30px) clamp(18px,2.6vw,32px) clamp(40px,5vw,60px)\">\n        <p style=\"margin:0 0 clamp(22px,3vw,30px);font-size:15px;font-weight:300;line-height:1.6;color:#9FB0C6;text-wrap:pretty\">Fourteen lessons, in order. Each one ends with today's numbers as the example.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ lessonList }}\" as=\"l\" hint-placeholder-count=\"14\">\n            <div sc-camel-on-click=\"{{ l.onClick }}\" style=\"{{ l.style }}\">\n              <div style=\"display:flex;gap:14px;align-items:baseline\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;color:{{ l.numColor }};flex:0 0 auto\">{{ l.num }}<\u002Fspan>\n                <div style=\"flex:1\">\n                  <div style=\"font-size:15px;line-height:1.4;color:#E6F1FF;margin-bottom:5px;text-wrap:pretty\">{{ l.hook }}<\u002Fdiv>\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.12em;color:#5A6B85\">{{ l.title }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;dataSet&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mock&quot;,&quot;alt&quot;],&quot;default&quot;:&quot;mock&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Data&quot;},&quot;flowSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.5,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;default&quot;:1,&quot;unit&quot;:&quot;x&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;narrativeTyping&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nconst BASE = '../';\n\n/* THE data source switch. Default is live; the mock sets stay\n   reachable forever as QA modes:  ?data=mock  and  ?data=alt  */\nconst DATA_SETS = { live: 'data/', mock: 'mock/', alt: 'mock/alt/' };\nconst DEFAULT_DATA_SET = 'live';\n\nconst C = {\n  bonds: '#4FC3F7', dollar: '#69F0AE', gold: '#FFD54F', stocks: '#B388FF', curve: '#4FC3F7',\n  danger: '#FF5252', amber: '#FFB74D', cyan: '#00E5FF', text: '#E6F1FF', dim: '#7A8BA3', faint: '#4A5A72'\n};\n\nconst REGIME_DEF = {\n  expansion: 'Growth is speeding up and prices are calm. Money moves toward things that grow.',\n  peak: 'Growth is still good but prices are rising too fast. The Fed leans tight, and cash pays well.',\n  contraction: 'Growth is slowing under high rates. Money moves toward safety and long bonds.',\n  recovery: 'Rates are coming down into a weak economy. The rebound usually starts here.'\n};\n\nconst ARC_COLOR = { expansion: C.dollar, peak: C.gold, contraction: C.danger, recovery: C.stocks };\nconst ASSET_NAME = { bonds: 'BONDS', dollar: 'US DOLLAR', gold: 'GOLD', stocks: 'STOCKS', curve: 'YIELD CURVE' };\nconst COT_NAME = { gold: 'GOLD', dxy: 'US DOLLAR', spx: 'S&P 500', tnote10: '10Y TREASURY' };\nconst COT_COLOR = { gold: C.gold, dxy: C.dollar, spx: C.stocks, tnote10: C.bonds };\nconst MOOD = {\n  SUNNY: { color: C.dollar, glyph: 'sun' },\n  CLEARING: { color: C.dollar, glyph: 'clearing' },\n  CAUTIOUS: { color: C.gold, glyph: 'cloud' },\n  STORMY: { color: C.danger, glyph: 'storm' }\n};\nconst ARROW = { up: '\u25b2', down: '\u25bc', sideways: '\u2192', drift: '\u2192', caution: '\u25c6', flatten: '\u2198', steepen: '\u2197' };\nconst MODULE_ANCHOR = { regime: 'mod-regime', dials: 'mod-dials', scenarios: 'mod-scenarios', flows: 'mod-flows', evidence: 'mod-evidence', calendar: 'mod-calendar' };\n\nclass Component extends DCLogic {\n  state = {\n    data: null, lessons: null, glossary: [], err: null,\n    t: 0, nc: 0, depth: 'trader', expanded: {},\n    selArc: null, showWork: false, scen: null, openNode: null,\n    calIdx: 0, showPast: false, lessonId: null, lessonData: null, indexOpen: false,\n    gloss: null, narrow: false\n  };\n\n  componentDidMount() {\n    this._mounted = true;\n    const params = new URLSearchParams(window.location.search);\n    const q = params.get('data') || (this.props.dataSet === 'alt' ? 'alt' : null);\n    this.dataSetName = DATA_SETS[q] ? q : DEFAULT_DATA_SET;\n    this.dataDir = DATA_SETS[this.dataSetName];\n    this._onResize = () => {\n      const n = window.innerWidth < 900;\n      if (n !== this.state.narrow) this.setState({ narrow: n });\n    };\n    this._onResize();\n    window.addEventListener('resize', this._onResize);\n    this.load();\n  }\n\n  componentWillUnmount() {\n    this._mounted = false;\n    cancelAnimationFrame(this._raf);\n    clearTimeout(this._typeT);\n    clearTimeout(this._snapT);\n    clearInterval(this._typeI);\n    window.removeEventListener('resize', this._onResize);\n  }\n\n  async getJSON(path) {\n    const b = window.__MF_BUNDLE;\n    try {\n      const r = await fetch(BASE + path);\n      if (!r.ok) throw new Error(path + ' ' + r.status);\n      return await r.json();\n    } catch (e) {\n      if (b && b[path] !== undefined) return b[path];\n      throw e;\n    }\n  }\n\n  async load() {\n    const names = ['overview', 'regime', 'dials', 'scenarios', 'flows', 'evidence', 'calendar'];\n    try {\n      const results = await Promise.all(\n        names.map(n => this.getJSON(this.dataDir + n + '.json'))\n          .concat([this.getJSON('content/lessons/index.json'), this.getJSON('content/glossary.json')])\n      );\n      if (!this._mounted) return;\n      const data = {};\n      names.forEach((n, i) => { data[n] = results[i]; });\n      const lessons = results[names.length];\n      const glossary = (results[names.length + 1] || {}).terms || [];\n      glossary.sort((a, b) => b.term.length - a.term.length);\n      this.setState({ data: data, lessons: lessons, glossary: glossary }, () => this.animate());\n    } catch (e) {\n      if (this._mounted) this.setState({ err: e.message });\n    }\n  }\n\n  animate() {\n    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const nar = ((this.state.data || {}).regime || {}).narrative || '';\n    if (reduce || this.props.narrativeTyping === false) { this.setState({ t: 1, nc: nar.length }); return; }\n    const dur = 900, t0 = performance.now();\n    const step = (now) => {\n      const p = Math.min(1, (now - t0) / dur);\n      this.setState({ t: 1 - Math.pow(1 - p, 3) });\n      if (p < 1) this._raf = requestAnimationFrame(step);\n    };\n    this._raf = requestAnimationFrame(step);\n    /* requestAnimationFrame never fires while the tab is hidden, so a page\n       opened in a background tab (or captured headlessly) would sit at t=0 and\n       render every animated figure as 0%. Snap to the final state if the\n       animation has not finished on its own. */\n    this._snapT = setTimeout(() => {\n      if (this._mounted && this.state.t < 1) this.setState({ t: 1, nc: nar.length });\n    }, dur + 1200);\n    this._typeT = setTimeout(() => {\n      this._typeI = setInterval(() => {\n        this.setState(s => {\n          const n = s.nc + 2;\n          if (n >= nar.length) { clearInterval(this._typeI); return { nc: nar.length }; }\n          return { nc: n };\n        });\n      }, 14);\n    }, 420);\n  }\n\n  /* ---------- slot resolver (content/README.md grammar) ---------- */\n\n  resolvePath(root, path) {\n    if (root === undefined || root === null || !path) return null;\n    let cur = root;\n    const segs = String(path).split('.');\n    for (let i = 0; i < segs.length; i++) {\n      let seg = segs[i];\n      if (cur === undefined || cur === null) return null;\n      const brackets = [];\n      seg = seg.replace(/\\[([^\\]]*)\\]/g, (m, inner) => { brackets.push(inner); return ''; });\n      if (seg) {\n        if (seg === 'length') { cur = Array.isArray(cur) ? cur.length : null; }\n        else if (seg.charAt(0) === '$') {\n          const key = this.resolvePath(root, seg.slice(1));\n          if (key === null) return null;\n          cur = cur[key];\n        } else cur = cur[seg];\n      }\n      for (let b = 0; b < brackets.length; b++) {\n        if (cur === undefined || cur === null) return null;\n        const inner = brackets[b];\n        const eq = inner.indexOf('=');\n        if (eq > -1) {\n          const k = inner.slice(0, eq), raw = inner.slice(eq + 1);\n          if (!Array.isArray(cur)) return null;\n          cur = cur.find(o => o && String(o[k]) === raw);\n        } else {\n          const idx = parseInt(inner, 10);\n          if (isNaN(idx) || !Array.isArray(cur)) return null;\n          cur = idx < 0 ? cur[cur.length + idx] : cur[idx];\n        }\n      }\n    }\n    return cur === undefined ? null : cur;\n  }\n\n  applyMap(v, map) {\n    if (v === null) return null;\n    if (map === 'updown_word') {\n      const n = Number(v);\n      if (isNaN(n)) return null;\n      return n > 0 ? 'up' : n < 0 ? 'down' : 'sideways';\n    }\n    if (map === 'percent') { const n = Number(v); return isNaN(n) ? null : n * 100; }\n    if (map === 'longshort_word') {\n      const n = Number(v);\n      if (isNaN(n)) return null;\n      return n >= 0 ? 'betting on higher prices' : 'betting on lower prices';\n    }\n    return v;\n  }\n\n  resolveSlot(spec) {\n    if (!spec || !this.state.data) return null;\n    const key = String(spec.file || '').replace(/\\.json$/, '');\n    let v = this.resolvePath(this.state.data[key], spec.path);\n    if (v === null || v === undefined) return null;\n    if (spec.map) v = this.applyMap(v, spec.map);\n    if (v === null || v === undefined) return null;\n    if (spec.round !== undefined && spec.round !== null) {\n      const n = Number(v);\n      if (isNaN(n)) return null;\n      v = n.toFixed(spec.round);\n    }\n    return v;\n  }\n\n  renderLive(live) {\n    if (!live || !live.template) return '';\n    const slots = live.slots || {};\n    return live.template.replace(/\\{(\\w+)\\}/g, (m, name) => {\n      const v = this.resolveSlot(slots[name]);\n      return (v === null || v === undefined || v === '') ? '\u2014' : String(v);\n    });\n  }\n\n  /* ---------- glossary ---------- */\n\n  glossTokens(text, used, keyPrefix) {\n    const terms = this.state.glossary || [];\n    const src = String(text || '');\n    if (!terms.length) return [{ t: src, style: { display: 'inline' } }];\n    const spans = [];\n    const taken = [];\n    for (let i = 0; i < terms.length; i++) {\n      const term = terms[i].term;\n      if (used[term.toLowerCase()]) continue;\n      const re = new RegExp('(^|[^A-Za-z])(' + term.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&') + ')(?![A-Za-z])', 'i');\n      const m = re.exec(src);\n      if (!m) continue;\n      const start = m.index + m[1].length, end = start + m[2].length;\n      if (taken.some(r => start < r[1] && end > r[0])) continue;\n      taken.push([start, end]);\n      used[term.toLowerCase()] = true;\n      spans.push({ start: start, end: end, term: term, plain: terms[i].plain, lesson: terms[i].lesson });\n    }\n    spans.sort((a, b) => a.start - b.start);\n    const out = [];\n    let pos = 0;\n    spans.forEach((s, i) => {\n      if (s.start > pos) out.push({ t: src.slice(pos, s.start), style: { display: 'inline' } });\n      const id = keyPrefix + ':' + s.term;\n      const isOpen = this.state.gloss === id;\n      out.push({\n        t: src.slice(s.start, s.end), plain: s.plain, open: isOpen,\n        style: {\n          display: 'inline', position: 'relative', cursor: 'help',\n          borderBottom: '1px dotted ' + (isOpen ? 'rgba(0,229,255,0.85)' : 'rgba(0,229,255,0.4)'),\n          color: isOpen ? '#C9F4FF' : 'inherit', transition: 'border-color .15s,color .15s'\n        },\n        onClick: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.setState({ gloss: isOpen ? null : id }); }\n      });\n      pos = s.end;\n    });\n    if (pos < src.length) out.push({ t: src.slice(pos), style: { display: 'inline' } });\n    return out.length ? out : [{ t: src, style: { display: 'inline' } }];\n  }\n\n  /* ---------- geometry helpers ---------- */\n\n  polar(cx, cy, r, a) {\n    const rad = a * Math.PI / 180;\n    return { x: +(cx + r * Math.sin(rad)).toFixed(2), y: +(cy - r * Math.cos(rad)).toFixed(2) };\n  }\n\n  arcPath(cx, cy, r, a0, a1) {\n    const p0 = this.polar(cx, cy, r, a0), p1 = this.polar(cx, cy, r, a1);\n    return 'M' + p0.x + ' ' + p0.y + ' A' + r + ' ' + r + ' 0 ' + ((a1 - a0) > 180 ? 1 : 0) + ' 1 ' + p1.x + ' ' + p1.y;\n  }\n\n  pos(x, y, vw, vh, anchor) {\n    const tx = anchor === 'e' ? '-100%' : anchor === 'w' ? '0%' : '-50%';\n    return { position: 'absolute', left: (x / vw * 100).toFixed(3) + '%', top: (y / vh * 100).toFixed(3) + '%', transform: 'translate(' + tx + ',-50%)', whiteSpace: 'nowrap' };\n  }\n\n  linePath(vals, box, dom, close) {\n    const n = vals.length;\n    if (!n) return { d: '', pts: [] };\n    const span = (dom.max - dom.min) || 1;\n    const pts = vals.map((v, i) => [\n      +(box.x + (n === 1 ? 0 : (box.w * i) / (n - 1))).toFixed(2),\n      +(box.y + box.h - ((v - dom.min) / span) * box.h).toFixed(2)\n    ]);\n    let d = 'M' + pts[0][0] + ' ' + pts[0][1];\n    for (let i = 1; i < pts.length; i++) d += ' L' + pts[i][0] + ' ' + pts[i][1];\n    if (close) d += ' L' + pts[pts.length - 1][0] + ' ' + (box.y + box.h) + ' L' + pts[0][0] + ' ' + (box.y + box.h) + ' Z';\n    return { d: d, pts: pts };\n  }\n\n  dom(vals, pad) {\n    if (!vals || !vals.length) return { min: 0, max: 1 };\n    const mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);\n    const p = ((mx - mn) || Math.abs(mx) || 1) * (pad === undefined ? 0.12 : pad);\n    return { min: mn - p, max: mx + p };\n  }\n\n  fmtDate(iso, withYear) {\n    if (!iso) return '\u2014';\n    const d = new Date(iso);\n    if (isNaN(d)) return String(iso);\n    const M = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];\n    return M[d.getUTCMonth()] + ' ' + d.getUTCDate() + (withYear ? ' ' + d.getUTCFullYear() : '');\n  }\n\n  signed(v, unit, dec) {\n    const n = Number(v);\n    if (isNaN(n)) return '\u2014';\n    return (n > 0 ? '+' : '') + n.toFixed(dec === undefined ? 1 : dec) + (unit || '');\n  }\n\n  scrollTo(id, highlight) {\n    const el = document.getElementById(id);\n    if (!el) return;\n    const top = el.getBoundingClientRect().top + window.pageYOffset - 70;\n    window.scrollTo({ top: top, behavior: 'smooth' });\n    if (highlight) { el.classList.add('mf-hl'); setTimeout(() => el.classList.remove('mf-hl'), 3800); }\n  }\n\n  openLesson(id) {\n    if (!id) return;\n    this.setState({ lessonId: id, lessonData: null, indexOpen: false, gloss: null });\n    const num = String(id).padStart(2, '0');\n    this.getJSON('content/lessons/lesson-' + num + '.json')\n      .then(d => { if (this._mounted && this.state.lessonId === id) this.setState({ lessonData: d }); })\n      .catch(() => {});\n  }\n\n  ensureOpen(mod) {\n    if (this.state.depth !== 'simple') return;\n    const ex = Object.assign({}, this.state.expanded);\n    ex[mod] = true;\n    this.setState({ expanded: ex });\n  }\n\n  /* ---------- render ---------- */\n\n  renderVals() {\n    const S = this.state;\n    const askStyle = {\n      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',\n      width: '17px', height: '17px', flex: '0 0 auto', borderRadius: '50%', cursor: 'pointer',\n      border: '1px solid rgba(230,241,255,0.16)', background: 'transparent',\n      fontFamily: \"'JetBrains Mono',monospace\", fontSize: '9.5px', lineHeight: '1',\n      color: '#5A6B85', opacity: 0.55, transition: 'opacity .15s,color .15s,border-color .15s'\n    };\n    const askHover = Object.assign({}, askStyle, { opacity: 1, color: C.cyan, borderColor: 'rgba(0,229,255,0.5)' });\n\n    if (!S.data) {\n      return {\n        loading: true, ready: false,\n        loadMsg: S.err ? ('DATA LINK FAILED \u2014 ' + S.err) : 'ESTABLISHING DATA LINK\u2026',\n        sys: { liveWord: 'BOOT', liveColor: C.cyan, asOf: 'CONNECTING', sources: BASE.replace(/^https?:\\/\\//, ''), dotStyle: { width: '6px', height: '6px', borderRadius: '50%', background: C.cyan, boxShadow: '0 0 10px ' + C.cyan, animation: 'mf-pulse 1.2s ease-in-out infinite' } },\n        depths: ['SIMPLE', 'TRADER', 'PRO'].map(k => ({ key: k, style: { padding: '5px 9px', borderRadius: '5px', fontSize: '9.5px', letterSpacing: '0.14em', color: '#5A6B85', cursor: 'pointer' }, onClick: () => {} })),\n        openIndex: () => {}, askStyle: askStyle, overlayOpen: false, lessonOpen: false, indexOpen: false\n      };\n    }\n\n    const D = S.data, t = S.t;\n    const depth = S.depth, isPro = depth === 'pro', isSimple = depth === 'simple';\n    const used = {};\n\n    /* --- status bar --- */\n    const stale = D.overview.stale;\n    const asOfDate = new Date(D.overview.as_of);\n    const stamp = isNaN(asOfDate) ? String(D.overview.as_of) : asOfDate.toISOString().slice(0, 16).replace('T', ' ') + ' UTC';\n    const sys = {\n      liveWord: stale ? 'STALE' : 'LIVE',\n      liveColor: stale ? C.amber : C.dollar,\n      asOf: 'DATA AS OF ' + stamp,\n      sources: 'FRED / CFTC / TREASURY' + (this.dataDir.indexOf('alt') > -1 ? ' \u00b7 ALT' : '') + (window.__MF_BUNDLE ? ' \u00b7 SNAPSHOT' : ''),\n      stamp: stamp,\n      dotStyle: { width: '6px', height: '6px', borderRadius: '50%', background: stale ? C.amber : C.dollar, boxShadow: '0 0 10px ' + (stale ? C.amber : C.dollar), animation: 'mf-pulse 2.4s ease-in-out infinite' }\n    };\n\n    const depths = ['SIMPLE', 'TRADER', 'PRO'].map(k => {\n      const on = k.toLowerCase() === depth;\n      return {\n        key: k,\n        onClick: () => this.setState({ depth: k.toLowerCase() }),\n        style: {\n          padding: '5px 9px', borderRadius: '5px', cursor: 'pointer',\n          fontFamily: \"'JetBrains Mono',monospace\", fontSize: '9.5px', letterSpacing: '0.14em',\n          color: on ? '#050810' : '#7A8BA3', background: on ? C.cyan : 'transparent',\n          fontWeight: on ? 600 : 400, transition: 'background .15s,color .15s'\n        }\n      };\n    });\n\n    /* --- Layer 1 --- */\n    const moodDef = MOOD[D.overview.mood.label] || MOOD.CAUTIOUS;\n    const glyphBase = { flex: '0 0 auto', display: 'block', borderRadius: '50%' };\n    const glyphStyle = moodDef.glyph === 'sun'\n      ? Object.assign({}, glyphBase, { width: 'clamp(26px,3.4vw,38px)', height: 'clamp(26px,3.4vw,38px)', background: moodDef.color, boxShadow: '0 0 40px ' + moodDef.color + '88' })\n      : moodDef.glyph === 'clearing'\n      ? Object.assign({}, glyphBase, { width: 'c hat matters is ' + (simpleName[(upcoming[0] || {}).event] || (upcoming[0] || {}).event) + '.'\n    };\n\n    return {\n      loading: false, ready: true, sys: sys, depths: depths, askStyle: askStyle, isPro: isPro,\n\n      mood: { label: D.overview.mood.label, color: moodDef.color, glyphStyle: glyphStyle },\n      moodTokens: moodTokens, heroAssets: heroAssets, bullets: bullets,\n      nextDate: nextDate, changed: changed,\n\n      simple: simple, summaryStyle: summaryStyle,\n      sum1: isSimple && !S.expanded.regime, open1: openFor('regime'), open1Click: mk('regime'),\n      sum2: isSimple && !S.expanded.dials, open2: openFor('dials'), open2Click: mk('dials'),\n      sum3: isSimple && !S.expanded.scenarios, open3: openFor('scenarios'), open3Click: mk('scenarios'),\n      sum4: isSimple && !S.expanded.flows, open4: openFor('flows'), open4Click: mk('flows'),\n      sum5: isSimple && !S.expanded.evidence, open5: openFor('evidence'), open5Click: mk('evidence'),\n      sum6: isSimple && !S.expanded.calendar, open6: openFor('calendar'), open6Click: mk('calendar'),\n\n      arcs: arcs, ticks: ticks,\n      needleT: 'rotate(' + (needleAngle * t).toFixed(2) + ' 280 280)',\n      projArc: this.arcPath(280, 280, 172, Math.min(needleAngle, projAngle), Math.max(needleAngle, projAngle)),\n      regime: {\n        current: D.regime.needle.toUpperCase(), next: D.regime.projection.toUpperCase(),\n        confLabel: isPro ? (P[D.regime.needle] || 0).toFixed(3) + ' CONF' : Math.round(conf * t) + '% CONFIDENCE',\n        since: D.regime.in_regime_since, duration: Math.floor(days / 30) + ' MO ' + (days % 30) + ' D'\n      },\n      sel: { key: selKey.toUpperCase(), def: REGIME_DEF[selKey], color: ARC_COLOR[selKey] },\n      narrativeTyped: nar.slice(0, S.nc),\n      inputs: inputs, showWork: S.showWork || isPro,\n      workChevron: (S.showWork || isPro) ? '\u2212' : '+',\n      toggleWork: () => this.setState({ showWork: !S.showWork }),\n      workGrid: {\n        display: 'grid', gri ize: 'clamp(24px,4.2vw,52px)', fontWeight: 500,\n          letterSpacing: '0.02em', color: scoreTone, textShadow: '0 0 34px ' + scoreTone + '8C'\n        }\n      },\n      scoreCardStyle: {\n        marginTop: '18px', padding: 'clamp(22px,3vw,38px) clamp(18px,2.6vw,38px)', borderRadius: '18px',\n        border: '1px solid ' + scoreTone + '38',\n        background: 'linear-gradient(180deg,' + scoreTone + '0D,rgba(8,13,24,0.6))',\n        backdropFilter: 'blur(14px)', boxShadow: '0 40px 90px -60px ' + scoreTone + '80'\n      },\n\n      events: events, calSel: calSel, past: past,\n      showPast: S.showPast, pastChevron: S.showPast ? '\u2212' : '+',\n      togglePast: () => this.setState({ showPast: !S.showPast }),\n\n      lessonCount: lessonCount, lesson: lesson, lessonList: lessonList, drawerStyle: drawerStyle,\n      lessonOpen: !!S.lessonId, indexOpen: S.indexOpen,\n      overlayOpen: !!S.lessonId || S.indexOpen,\n      openIndex: () => this.setState({ indexOpen: true, lessonId: null, lessonData: null }),\n      closeOverlay: () => this.setState({ lessonId: null, lessonData: null, indexOpen: false }),\n      ask: {\n        regime: () => this.openLesson(12), probability: () => this.openLesson(3),\n        dials: () => this.openLesson(5), verdict: () => this.openLesson(5),\n        scenarios: () => this.openLesson(13), flows: () => this.openLesson(2),\n        curve: () => this.openLesson(7), real: () => this.openLesson(9),\n        cot: () => this.openLesson(14), scorecard: () => this.openLesson(4),\n        calendar: () => this.openLesson(13)\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
